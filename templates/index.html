<!DOCTYPE html>
<html lang="pl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undergroundzone Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141419;
            --accent-green: #00ff66;
            --accent-blue: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #8b8b9e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: url('background.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            padding-bottom: 80px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 14, 0.88);
            z-index: -1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent-green);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-wrapper {
            display: flex;
            align-items: center;
            background: #0b0b0e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 8px;
            gap: 6px;
        }

        .lang-icon {
            font-size: 16px;
        }

        .lang-select {
            background: transparent;
            color: var(--text-main);
            border: none;
            font-size: 13px;
            cursor: pointer;
            outline: none;
        }

        .user-tickets {
            background: rgba(0, 255, 102, 0.1);
            color: var(--accent-green);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            color: var(--text-main);
        }

        .clicker-section {
            text-align: center;
            padding: 10px 0;
        }

        .clicker-btn {
            background: linear-gradient(135deg, #00ff66, #00b347);
            color: #0b0b0e;
            border: none;
            padding: 16px 32px;
            font-size: 20px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 102, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .clicker-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(0, 255, 102, 0.2);
        }

        .pool-display {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent-blue);
            margin: 8px 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--text-main);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .admin-panel {
            border: 1px solid rgba(0, 210, 255, 0.3);
            display: none;
        }

        .admin-input {
            width: 100%;
            padding: 10px;
            background: #0b0b0e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .admin-btn {
            background: var(--accent-blue);
            color: #0b0b0e;
            border: none;
            padding: 10px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body id="body-dir">

    <header>
        <div class="logo">UNDERGROUNDZONE</div>
        <div class="header-right">
            <div class="lang-wrapper">
                <span class="lang-icon">🌐</span>
                <select class="lang-select" id="lang-switcher" onchange="changeLanguage(this.value)">
                    <option value="pl" selected>Polski</option>
                    <option value="en">English</option>
                    <option value="ru">Русский</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                    <option value="fr">Français</option>
                    <option value="zh">中文</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
            <div class="user-tickets" id="header-tickets">🎟️ 0</div>
        </div>
    </header>

    <div class="card">
        <h2 data-i18n="clicker_title">⚡ Główny Panel / Kliker</h2>
        <p style="color: var(--text-muted); font-size: 14px;" data-i18n="clicker_desc">Klikaj, zbieraj punkty i zwiększaj swoje szanse w losowaniach!</p>
        <div class="clicker-section">
            <button class="clicker-btn" onclick="triggerClick()">
                <span>⛏️</span> <span data-i18n="clicker_btn">KOP BILETY</span>
            </button>
            <div style="margin-top: 15px; font-size: 14px; color: var(--text-muted);">
                <span data-i18n="clicker_session">Kliknięcia w sesji:</span> <span id="click-counter" style="color: var(--accent-green); font-weight: bold;">0</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 data-i18n="pool_title">🎁 Pula Nagród Giveaway</h2>
        <div class="stat-box" style="background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.1);">
            <div class="pool-display" id="pool-amount">$15.00</div>
            <div class="stat-label" data-i18n="pool_label">Aktualna pula w USD (split dla zwycięzców)</div>
        </div>
        <div class="stats-grid" style="margin-top: 12px;">
            <div class="stat-box">
                <div class="stat-value" id="user-ref-count">0</div>
                <div class="stat-label" data-i18n="stat_refs">Zaproszone osoby</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="user-tickets-box">0</div>
                <div class="stat-label" data-i18n="stat_tickets">Twoje bilety 🎟️</div>
            </div>
        </div>
    </div>

    <div class="card admin-panel" id="admin-card">
        <h2 data-i18n="admin_title">🛠️ Panel Administratora</h2>
        <input type="text" id="admin-pool-input" class="admin-input" placeholder="Kwota do dodania do puli (np. 10)">
        <button class="admin-btn" onclick="adminAction('add_pool')" data-i18n="admin_btn">Dodaj do puli</button>
    </div>

    <script>
        const translations = {
            pl: {
                clicker_title: "⚡ Główny Panel / Kliker",
                clicker_desc: "Klikaj, zbieraj punkty i zwiększaj swoje szanse w losowaniach!",
                clicker_btn: "KOP BILETY",
                clicker_session: "Kliknięcia w sesji:",
                pool_title: "🎁 Pula Nagród Giveaway",
                pool_label: "Aktualna pula w USD (split dla zwycięzców)",
                stat_refs: "Zaproszone osoby",
                stat_tickets: "Twoje bilety 🎟️",
                admin_title: "🛠️ Panel Administratora",
                admin_btn: "Dodaj do puli"
            },
            en: {
                clicker_title: "⚡ Main Panel / Clicker",
                clicker_desc: "Click, collect points and increase your chances in giveaways!",
                clicker_btn: "MINE TICKETS",
                clicker_session: "Session clicks:",
                pool_title: "🎁 Giveaway Prize Pool",
                pool_label: "Current pool in USD (split for winners)",
                stat_refs: "Invited friends",
                stat_tickets: "Your tickets 🎟️",
                admin_title: "🛠️ Admin Panel",
                admin_btn: "Add to pool"
            },
            ru: {
                clicker_title: "⚡ Главная панель / Кликер",
                clicker_desc: "Кликайте, собирайте очки и увеличивайте шансы в розыгрышах!",
                clicker_btn: "ДОБЫТЬ БИЛЕТЫ",
                clicker_session: "Кликов за сессию:",
                pool_title: "🎁 Призовой фонд розыгрыша",
                pool_label: "Текущий фонд в USD (делится между победителями)",
                stat_refs: "Приглашенные друзья",
                stat_tickets: "Ваши билеты 🎟️",
                admin_title: "🛠️ Панель администратора",
                admin_btn: "Добавить в пул"
            },
            es: {
                clicker_title: "⚡ Panel Principal / Clicker",
                clicker_desc: "¡Haz clic, acumula puntos y aumenta tus posibilidades en los sorteos!",
                clicker_btn: "MINAR TICKETS",
                clicker_session: "Clics de sesión:",
                pool_title: "🎁 Pozo de Premios",
                pool_label: "Pozo actual en USD (repartido entre ganadores)",
                stat_refs: "Amigos invitados",
                stat_tickets: "Tus tickets 🎟️",
                admin_title: "🛠️ Panel de Administrador",
                admin_btn: "Añadir al pozo"
            },
            de: {
                clicker_title: "⚡ Hauptpanel / Klicker",
                clicker_desc: "Klicken, Punkte sammeln und die Gewinnchancen erhöhen!",
                clicker_btn: "TICKETS MINEN",
                clicker_session: "Sitzungsklicks:",
                pool_title: "🎁 Gewinnspiel-Preispool",
                pool_label: "Aktueller Pool in USD (geteilt für Gewinner)",
                stat_refs: "Eingeladene Freunde",
                stat_tickets: "Deine Tickets 🎟️",
                admin_title: "🛠️ Admin-Bereich",
                admin_btn: "Zum Pool hinzufügen"
            },
            fr: {
                clicker_title: "⚡ Panneau Principal / Clicker",
                clicker_desc: "Cliquez, gagnez des points et augmentez vos chances aux tirages !",
                clicker_btn: "MINER DES TICKETS",
                clicker_session: "Clics de session :",
                pool_title: "🎁 Cagnotte du Giveaway",
                pool_label: "Cagnotte actuelle en USD (partagée aux gagnants)",
                stat_refs: "Amis invités",
                stat_tickets: "Vos tickets 🎟️",
                admin_title: "🛠️ Panneau Admin",
                admin_btn: "Ajouter à la cagnotte"
            },
            zh: {
                clicker_title: "⚡ 主面板 / 点击器",
                clicker_desc: "点击收集积分，增加抽奖中奖几率！",
                clicker_btn: "挖掘门票",
                clicker_session: "本话点击量：",
                pool_title: "🎁 抽奖奖池",
                pool_label: "当前奖池 (美元，由胜者平分)",
                stat_refs: "邀请的好友",
                stat_tickets: "你的门票 🎟️",
                admin_title: "🛠️ 管理面板",
                admin_btn: "添加到奖池"
            },
            ar: {
                clicker_title: "⚡ لوحة التحكم الرئيسية / النقر",
                clicker_desc: "انقر، واجمع النقاط وقم بزيادة فرصك في السحوبات!",
                clicker_btn: "تعدين التذاكر",
                clicker_session: "ننقرات الجلسة:",
                pool_title: "🎁 جوائز السحب",
                pool_label: "الجوائز الحالية بالدولار (تُقسم بين الفائزين)",
                stat_refs: "الأصدقاء المدعوون",
                stat_tickets: "تذاكرك 🎟️",
                admin_title: "🛠️ لوحة المشرف",
                admin_btn: "إضافة إلى الجوائز"
            }
        };

        function changeLanguage(lang) {
            localStorage.setItem('ug_lang', lang);
            const t = translations[lang] || translations['en'];
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerText = t[key];
                }
            });

            if (lang === 'ar') {
                document.getElementById('html-root').setAttribute('dir', 'rtl');
            } else {
                document.getElementById('html-root').setAttribute('dir', 'ltr');
            }
        }

        const savedLang = localStorage.getItem('ug_lang') || 'pl';
        document.getElementById('lang-switcher').value = savedLang;
        changeLanguage(savedLang);

        const tg = window.Telegram.WebApp;
        tg.expand();

        let userId = 8998575936; 
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        }

        if (userId === 8998575936) {
            document.getElementById('admin-card').style.display = 'block';
        }

        let sessionClicks = 0;

        function triggerClick() {
            sessionClicks++;
            document.getElementById('click-counter').innerText = sessionClicks;
            
            let currentTickets = parseInt(localStorage.getItem('ug_tickets') || '0') + 1;
            localStorage.setItem('ug_tickets', currentTickets);
            document.getElementById('header-tickets').innerText = `🎟️ ${currentTickets}`;
            document.getElementById('user-tickets-box').innerText = currentTickets;
        }

        async function fetchUserData() {
            try {
                const response = await fetch(`/api/user/${userId}`);
                const data = await response.json();
                
                const tickets = data.tickets !== undefined ? data.tickets : (data.points !== undefined ? data.points : 1);
                
                document.getElementById('header-tickets').innerText = `🎟️ ${tickets}`;
                document.getElementById('user-tickets-box').innerText = tickets;
                document.getElementById('user-ref-count').innerText = data.referrals_count || 0;
                
                if (data.pool_amount !== undefined) {
                    document.getElementById('pool-amount').innerText = `$${parseFloat(data.pool_amount).toFixed(2)}`;
                }
            } catch (e) {
                console.error("Błąd pobierania danych użytkownika:", e);
            }
        }

        async function adminAction(actionType) {
            const val = document.getElementById('admin-pool-input').value;
            try {
                const res = await fetch(`/api/admin/${actionType}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, text: val })
                });
                const result = await res.json();
                alert(result.message || "Wykonano!");
                fetchUserData();
            } catch (e) {
                alert("Błąd połączenia z serwerem.");
            }
        }

        fetchUserData();
        setInterval(fetchUserData, 10000);
    </script>
</body>
</html>
