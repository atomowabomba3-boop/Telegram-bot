<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undrgroundzone Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: #1e1e1e;
            --border-color: #2c2c2c;
            --admin-color: #e53935;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .header-card {
            text-align: center;
        }

        .title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .stat-box {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: var(--button-color);
        }

        .stat-label {
            font-size: 12px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .admin-section {
            display: none;
            border-color: var(--admin-color);
        }

        .admin-title {
            color: var(--admin-color);
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-btn {
            background-color: var(--admin-color);
            margin-top: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #121212;
            color: var(--text-color);
            box-sizing: border-box;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .status-msg {
            font-size: 13px;
            text-align: center;
            margin-top: 8px;
            color: var(--hint-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profil / Statystyki użytkownika -->
        <div class="card header-card">
            <div class="title">🔥 Undrgroundzone Hub</div>
            <div id="username" style="color: var(--hint-color); font-size: 14px;">Loading profile...</div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-value" id="user-points">-</div>
                    <div class="stat-label">Your Tickets</div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="user-refs">-</div>
                    <div class="stat-label">Referrals</div>
                </div>
            </div>
        </div>

        <!-- Tabela wyników -->
        <div class="card">
            <div class="title" style="font-size: 16px; margin-bottom: 12px;">🏆 Top Leaderboard</div>
            <ul class="leaderboard-list" id="leaderboard">
                <li class="leaderboard-item"><span>Loading...</span><span>-</span></li>
            </ul>
        </div>

        <!-- Panel Administratora (widoczny tylko dla ADMIN_IDS) -->
        <div class="card admin-section" id="admin-panel">
            <div class="admin-title">⚡ Admin Control Panel</div>
            
            <label style="font-size: 13px;">Add Pool Amount ($):</label>
            <input type="number" id="admin-pool-input" placeholder="15" value="15">
            <button class="admin-btn" onclick="adminAction('add_pool')">Add to Giveaway Pool</button>

            <label style="font-size: 13px; margin-top: 12px; display: block;">Target User ID:</label>
            <input type="number" id="admin-target-id" placeholder="User ID">
            <label style="font-size: 13px;">Tickets Count:</label>
            <input type="number" id="admin-tickets-count" placeholder="10">
            <button class="admin-btn" onclick="adminAction('add_tickets')">Add Tickets to User</button>

            <button class="admin-btn" style="margin-top: 16px;" onclick="adminAction('start')">Start New Giveaway</button>
            <button class="admin-btn" style="background-color: #f57c00;" onclick="adminAction('winners')">Draw Winners Now</button>
            
            <div class="status-msg" id="admin-status"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const userId = user ? user.id : 8998575936; // Fallback do testów lokalnych dla admina

        if (user) {
            document.getElementById('username').innerText = `@${user.username || user.first_name}`;
        } else {
            document.getElementById('username').innerText = `User ID: ${userId} (Debug)`;
        }

        // Lista uprzywilejowanych adminów zgodna z backendem
        const ADMIN_IDS = [8998575936];

        if (ADMIN_IDS.includes(userId)) {
            document.getElementById('admin-panel').style.display = 'block';
        }

        // Pobieranie danych użytkownika
        async function fetchUserData() {
            try {
                const response = await fetch(`/api/user/${userId}`);
                const data = await response.json();
                document.getElementById('user-points').innerText = data.points ?? 1;
                document.getElementById('user-refs').innerText = data.referrals_count ?? 0;
            } catch (e) {
                console.error("Error fetching user data:", e);
            }
        }

        // Pobieranie tabeli wyników
        async function fetchLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();
                const listEl = document.getElementById('leaderboard');
                listEl.innerHTML = '';
                
                if (data.length === 0) {
                    listEl.innerHTML = '<li class="leaderboard-item"><span>No records yet</span><span>-</span></li>';
                    return;
                }

                data.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.className = 'leaderboard-item';
                    li.innerHTML = `<span>#${index + 1} ID: ${item.user_id}</span><span>🎟 ${item.points}</span>`;
                    listEl.appendChild(li);
                });
            } catch (e) {
                console.error("Error fetching leaderboard:", e);
            }
        }

        // Obsługa akcji administratora
        async function adminAction(actionType) {
            const statusEl = document.getElementById('admin-status');
            statusEl.innerText = "Processing...";

            let payload = { user_id: userId };

            if (actionType === 'add_pool') {
                payload.text = document.getElementById('admin-pool-input').value;
            } else if (actionType === 'add_tickets') {
                payload.target_id = parseInt(document.getElementById('admin-target-id').value);
                payload.count = parseInt(document.getElementById('admin-tickets-count').value);
            }

            try {
                const response = await fetch(`/api/admin/${actionType}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                statusEl.innerText = result.message || "Done!";
                fetchUserData();
                fetchLeaderboard();
            } catch (e) {
                statusEl.innerText = "Error executing action.";
                console.error(e);
            }
        }

        // Inicjalizacja przy ładowaniu strony
        fetchUserData();
        fetchLeaderboard();
    </script>
</body>
</html>
